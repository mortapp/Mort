name: MORTIOSV8
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    CODE_SIGN_STYLE: Automatic

packages:
  Stripe:
    url: https://github.com/stripe/stripe-ios-spm
    exactVersion: 25.17.0

targets:
  MORTIOSV8:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: MORTIOSV8
    dependencies:
      - package: Stripe
        product: StripePaymentSheet
    info:
      path: MORTIOSV8/Info.plist
      properties:
        CFBundleDisplayName: MORT
        CFBundleURLTypes:
          - CFBundleURLName: com.mortapp.mobile
            CFBundleURLSchemes:
              - com.mortapp.mobile
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: "MORT uses the camera so you can add proof photos when a job is done."
        NSPhotoLibraryUsageDescription: "MORT lets you attach a photo from your library as job proof."
        UILaunchScreen: {}
    entitlements:
      path: MORTIOSV8/MORTIOSV8.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mortapp.mobile
        PRODUCT_NAME: MORTIOSV8
        TARGETED_DEVICE_FAMILY: "1"

  MORTIOSV8Tests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: MORTIOSV8Tests
    dependencies:
      - target: MORTIOSV8
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mortapp.mobile.tests
        GENERATE_INFOPLIST_FILE: YES

  MORTIOSV8UITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: MORTIOSV8UITests
    dependencies:
      - target: MORTIOSV8
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mortapp.mobile.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  MORTIOSV8:
    build:
      targets:
        MORTIOSV8: all
        MORTIOSV8Tests: [test]
        MORTIOSV8UITests: [test]
    test:
      gatherCoverageData: true
      targets:
        - name: MORTIOSV8Tests
        - name: MORTIOSV8UITests
