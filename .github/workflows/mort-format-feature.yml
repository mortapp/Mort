name: MORT Feature Formatter

on:
  push:
    branches: [feature/mort-verify-age-school]
    paths:
      - flutter_mort/lib/data/models/account_trust.dart
      - flutter_mort/lib/data/repositories/account_trust_repository.dart
      - flutter_mort/lib/data/repositories/providers.dart
      - flutter_mort/lib/features/trust/teen_verification_screens.dart
      - flutter_mort/test/teen_verification_status_test.dart
      - .github/workflows/mort-format-feature.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/mort-verify-age-school
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true
      - name: Format MORT Verify Dart files
        working-directory: flutter_mort
        run: >-
          dart format
          lib/data/models/account_trust.dart
          lib/data/repositories/account_trust_repository.dart
          lib/data/repositories/providers.dart
          lib/features/trust/teen_verification_screens.dart
          test/teen_verification_status_test.dart
      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatter changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flutter_mort/lib/data/models/account_trust.dart                   flutter_mort/lib/data/repositories/account_trust_repository.dart                   flutter_mort/lib/data/repositories/providers.dart                   flutter_mort/lib/features/trust/teen_verification_screens.dart                   flutter_mort/test/teen_verification_status_test.dart
          git commit -m "style(verify): apply dart formatter"
          git push origin HEAD:feature/mort-verify-age-school
