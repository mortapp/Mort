name: MORT guardian consent draft (disposable replica)

on:
  pull_request:
    paths:
      - .github/workflows/mort-guardian-consent-draft.yml
      - scripts/qa/replica/**
      - supabase/production-baseline-migrations/**
  push:
    branches: [hardening/guardian-consent-contract-20261122]

permissions:
  contents: read

jobs:
  guardian-consent-replica:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: supabase/setup-cli@v3
        with:
          version: 2.122.1
      - run: pnpm install --frozen-lockfile
      - name: Validate draft against real local GoTrue, RLS and pending baseline
        env:
          REPLICA_OUT: ${{ runner.temp }}/guardian-consent-out
          RUN_GUARDIAN_CONSENT_DRAFT: '1'
        run: scripts/qa/replica/build-and-test.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guardian-consent-disposable-replica
          path: |
            ${{ runner.temp }}/guardian-consent-out/journeys.json
            ${{ runner.temp }}/guardian-consent-out/authz.json
            ${{ runner.temp }}/guardian-consent-out/journeys.log
            ${{ runner.temp }}/guardian-consent-out/authz.log
            ${{ runner.temp }}/guardian-consent-out/replica-fingerprint.txt
          if-no-files-found: warn
