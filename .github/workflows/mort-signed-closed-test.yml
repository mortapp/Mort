name: MORT Signed Closed Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-android:
    environment: closed-test-release
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Materialize protected upload keystore
        shell: pwsh
        env:
          MORT_UPLOAD_KEYSTORE_BASE64: ${{ secrets.MORT_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MORT_UPLOAD_KEYSTORE_BASE64)) { throw 'Missing protected keystore secret.' }
          $path = Join-Path $env:RUNNER_TEMP 'mort-upload-key.jks'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:MORT_UPLOAD_KEYSTORE_BASE64))
          "MORT_UPLOAD_KEYSTORE_PATH=$path" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build and verify signed APK and AAB
        shell: pwsh
        env:
          MORT_UPLOAD_KEY_ALIAS: ${{ secrets.MORT_UPLOAD_KEY_ALIAS }}
          MORT_UPLOAD_STORE_PASSWORD: ${{ secrets.MORT_UPLOAD_STORE_PASSWORD }}
          MORT_UPLOAD_KEY_PASSWORD: ${{ secrets.MORT_UPLOAD_KEY_PASSWORD }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          ./scripts/build-standard-closed-test-apk.ps1
          ./scripts/build-standard-closed-test-aab.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: mort-signed-closed-test
          path: |
            build/play/mort-closed-test-*.apk
            build/play/mort-closed-test-*.aab
            build/play/*-build-manifest.json
            build/play/reports/**
          if-no-files-found: error
          retention-days: 14

