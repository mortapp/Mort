name: MORT DB Security Audit

on:
  workflow_dispatch:
    inputs:
      include_production:
        description: Dump production (mort p) catalog
        required: false
        default: true
        type: boolean
      include_qa:
        description: Dump QA (mort p backend test) catalog
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: backend-operations
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit production (mort p)
        if: ${{ inputs.include_production }}
        env:
          MORT_AUDIT_PROJECT_REF: jxbnrkasktbhtiujkhay
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.QA_SUPABASE_ACCESS_TOKEN }}
        run: node scripts/audit-db-security-remote.mjs audit-output/production
      - name: Audit QA (mort p backend test)
        if: ${{ inputs.include_qa }}
        env:
          MORT_AUDIT_PROJECT_REF: ckcxakhxqlkhppsxxjhv
          SUPABASE_DB_PASSWORD: ${{ secrets.QA_SUPABASE_DB_PASSWORD }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.QA_SUPABASE_ACCESS_TOKEN }}
        run: node scripts/audit-db-security-remote.mjs audit-output/qa
      - uses: actions/upload-artifact@v7
        with:
          name: mort-db-security-audit
          path: audit-output/
          if-no-files-found: error
          retention-days: 14
