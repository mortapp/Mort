project_id = "mort-mobile"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "mort://"
additional_redirect_urls = ["mort://", "http://localhost:8081", "exp://127.0.0.1:8081"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "10MiB"

[edge_runtime]
enabled = true
policy = "per_worker"

[functions.identity-verification-webhook]
verify_jwt = false

[functions.stripe-webhook]
verify_jwt = false

[functions.google-play-rtdn]
verify_jwt = false

[functions.avatar-url]
verify_jwt = true

[functions.support-evidence-url]
verify_jwt = true

[functions.ai-support]
verify_jwt = true

[functions.stripe-resolve-job-payment]
verify_jwt = true
