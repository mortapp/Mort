name: MORT Encrypted Backup

on:
  workflow_dispatch:
    inputs:
      include_feature_data:
        description: Include feature data snapshot (all public table rows)
        required: false
        default: true
        type: boolean
  schedule:
    - cron: "17 7 * * 1"

permissions:
  contents: read

jobs:
  backup:
    environment: backend-operations
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create metadata-only schema snapshot
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: node scripts/backup-feature-schema.mjs
      - name: Create feature data snapshot
        if: ${{ github.event_name == 'schedule' || inputs.include_feature_data != false }}
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: node scripts/backup-feature-data.mjs
      - name: Encrypt backup before artifact upload
        env:
          BACKUP_ARCHIVE_PASSPHRASE: ${{ secrets.BACKUP_ARCHIVE_PASSPHRASE }}
        run: |
          test -n "$BACKUP_ARCHIVE_PASSPHRASE"
          tar -czf "$RUNNER_TEMP/mort-backup.tar.gz" backups/ supabase/migrations/ supabase/functions/ supabase/config.toml supabase/production-baseline-recovery/
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -pass env:BACKUP_ARCHIVE_PASSPHRASE -in "$RUNNER_TEMP/mort-backup.tar.gz" -out "$RUNNER_TEMP/mort-backup.tar.gz.enc"
          sha256sum "$RUNNER_TEMP/mort-backup.tar.gz.enc" > "$RUNNER_TEMP/mort-backup.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: mort-encrypted-backup
          path: |
            ${{ runner.temp }}/mort-backup.tar.gz.enc
            ${{ runner.temp }}/mort-backup.sha256
          if-no-files-found: error
          retention-days: 30

  full-dr-backup:
    # Full disaster-recovery backup (auth identities, private + public schemas,
    # Storage metadata AND bytes) sealed with AES-256-GCM. OFF until the owner
    # approves: set repository variable MORT_FULL_DR_BACKUP=1 and add the
    # backend-operations secrets SUPABASE_SERVICE_ROLE_KEY and
    # MORT_BACKUP_ENCRYPTION_KEY. Read-only against production.
    # Runbook: docs/operations/MORT_DISASTER_RECOVERY_RUNBOOK_2026-11-16.md
    if: ${{ vars.MORT_FULL_DR_BACKUP == '1' }}
    environment: backend-operations
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Full encrypted DR backup
        env:
          DR_SOURCE: production
          DR_OUT: ${{ runner.temp }}/dr
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MORT_BACKUP_ENCRYPTION_KEY: ${{ secrets.MORT_BACKUP_ENCRYPTION_KEY }}
        run: node scripts/dr/dr-full-backup.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: mort-full-dr-backup
          path: |
            ${{ runner.temp }}/dr/*.enc
            ${{ runner.temp }}/dr/*.sha256
          if-no-files-found: error
          retention-days: 30
