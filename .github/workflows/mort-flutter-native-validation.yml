name: MORT Flutter native validation

on:
  pull_request:
    paths:
      - "flutter_mort/**"
      - "scripts/qa/run-flutter-android-native-smoke.sh"
      - "scripts/android-ads-manifest-common.ps1"
      - "scripts/qa-aab-signing.mjs"
      - "scripts/qa/aab-signing-evidence.test.mjs"
      - "scripts/verify-android-ads-manifest.ps1"
      - "scripts/qa/android-ads-manifest.test.ps1"
      - ".github/workflows/mort-flutter-native-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mort-flutter-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-simulator:
    # No signing secrets, archive, IPA, store upload or hosted backend.
    # The locked Stripe iOS pod compiles UIKit APIs introduced with iOS 26.
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: flutter_mort
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true
      - name: Prepare Flutter and CocoaPods
        run: |
          set -euo pipefail
          xcode_version="$(xcodebuild -version)"
          printf '%s\n' "$xcode_version"
          grep -Eq '^Xcode 26\.' <<< "$xcode_version"
          sdk="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          printf 'iOS Simulator SDK %s\n' "$sdk"
          [[ "$sdk" == 26.* ]]
          flutter config --no-enable-swift-package-manager
          flutter pub get
      - name: Compile for iOS Simulator without signing
        run: >-
          flutter build ios --simulator --debug --no-codesign
          --dart-define=MORT_RELEASE_STAGE=internal_test
          --dart-define=MORT_RELEASE_PROFILE=automated_test
          --dart-define=MORT_OPERATIONAL_MODE=automated_test
      - name: Run native iOS smoke tests
        run: |
          set -euo pipefail
          udid="$(xcrun simctl list devices available -j | jq -r '
            [.devices | to_entries[] | select(.key | contains(".iOS-"))
              | .value[] | select(.name | startswith("iPhone"))] | last.udid // empty
          ')"
          test -n "$udid"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          flutter test --no-pub integration_test/ios_native_smoke_test.dart -d "$udid" \
            --dart-define=MORT_RELEASE_STAGE=internal_test \
            --dart-define=MORT_RELEASE_PROFILE=automated_test \
            --dart-define=MORT_OPERATIONAL_MODE=automated_test

  android-emulator:
    # Builds and installs only the debug integration APK in an ephemeral runner.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: flutter_mort
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true
      - run: flutter pub get
      - name: Test Android manifest policy assertions
        shell: pwsh
        run: ../scripts/qa/android-ads-manifest.test.ps1
      - name: Test closed-test AAB evidence binding
        run: node --test ../scripts/qa/aab-signing-evidence.test.mjs
      - name: Enable emulator access to KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run native Android smoke tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: flutter_mort
          script: bash ../scripts/qa/run-flutter-android-native-smoke.sh
      - name: Verify the packaged no-ads debug APK used by smoke tests
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print \
            build/app/outputs/flutter-apk/app-debug.apk > "$RUNNER_TEMP/mort-no-ads-manifest.xml"
          pwsh -NoProfile -File ../scripts/verify-android-ads-manifest.ps1 \
            -ManifestPath "$RUNNER_TEMP/mort-no-ads-manifest.xml" -ExpectedAds Disabled
      - name: Verify an ads-enabled debug control without installing or launching it
        run: |
          set -euo pipefail
          flutter build apk --debug --no-pub --target-platform android-x64 \
            --dart-define=ADS_ENABLED=true --dart-define=USE_TEST_ADS=true
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print \
            build/app/outputs/flutter-apk/app-debug.apk > "$RUNNER_TEMP/mort-ads-control-manifest.xml"
          pwsh -NoProfile -File ../scripts/verify-android-ads-manifest.ps1 \
            -ManifestPath "$RUNNER_TEMP/mort-ads-control-manifest.xml" -ExpectedAds Enabled
