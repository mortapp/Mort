name: MORT iOS V8 Contract

on:
  push:
    branches:
      - codex/ios-v8-integration
    paths:
      - 'ios/**'
      - '.github/workflows/mort-ios-v8-contract.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/mort-ios-v8-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mort-ios-v8-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-contract:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      # Pushes to the integration branch keep their historical behaviour;
      # pull requests and manual runs compile the code under review.
      - name: Checkout source under review
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && 'codex/ios-v8-integration' || '' }}

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          brew install xcodegen

      - name: Generate project
        run: |
          set -euo pipefail
          xcodegen generate --spec ios/project.yml

      - name: Compile app and tests without booting a simulator
        run: |
          set -euo pipefail
          xcodebuild build-for-testing \
            -project ios/MORTIOSV8.xcodeproj \
            -scheme MORTIOSV8 \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/mort-ios-v8-contract" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Select iPhone simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; ids=[x["udid"] for runtime in d.values() for x in runtime if x.get("isAvailable") and x.get("name", "").startswith("iPhone")]; print(ids[0] if ids else "")')"
          test -n "$DEVICE_ID"
          echo "id=$DEVICE_ID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE_ID" -b

      # Unit tests only. No archive, signing, export or upload.
      - name: Unit tests
        run: |
          set -euo pipefail
          xcodebuild test \
            -project ios/MORTIOSV8.xcodeproj \
            -scheme MORTIOSV8 \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
            -derivedDataPath "$RUNNER_TEMP/mort-ios-v8-test" \
            -only-testing:MORTIOSV8Tests \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
