name: MORT Public Production Android AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-production-aab:
    environment: Production
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies
        run: flutter pub get
        working-directory: flutter_mort
      - name: Analyze Flutter app
        run: flutter analyze --no-pub
        working-directory: flutter_mort
      - name: Run Flutter tests
        run: flutter test --no-pub
        working-directory: flutter_mort
      - name: Verify signed build secret boundary
        run: node scripts/qa-signed-build-secret-boundary.mjs
      - name: Materialize protected upload keystore
        shell: pwsh
        env:
          MORT_UPLOAD_KEYSTORE_BASE64: ${{ secrets.MORT_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MORT_UPLOAD_KEYSTORE_BASE64)) { throw 'Missing protected production upload keystore.' }
          $path = Join-Path $env:RUNNER_TEMP 'mort-upload-key.jks'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:MORT_UPLOAD_KEYSTORE_BASE64))
          "MORT_UPLOAD_KEYSTORE_PATH=$path" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build and verify public production AAB
        shell: pwsh
        env:
          MORT_UPLOAD_KEY_ALIAS: ${{ secrets.MORT_UPLOAD_KEY_ALIAS }}
          MORT_UPLOAD_STORE_PASSWORD: ${{ secrets.MORT_UPLOAD_STORE_PASSWORD }}
          MORT_UPLOAD_KEY_PASSWORD: ${{ secrets.MORT_UPLOAD_KEY_PASSWORD }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          node scripts/qa-public-production-release-path.mjs
          ./scripts/build-android-release.ps1 -Profile production_public
      - name: Remove temporary upload keystore
        if: always()
        shell: pwsh
        run: |
          if ($env:MORT_UPLOAD_KEYSTORE_PATH -and (Test-Path -LiteralPath $env:MORT_UPLOAD_KEYSTORE_PATH)) {
            Remove-Item -LiteralPath $env:MORT_UPLOAD_KEYSTORE_PATH -Force
          }
      - uses: actions/upload-artifact@v7
        with:
          name: mort-public-production-aab
          path: |
            build/play/mort-production-public-*.aab
            build/play/*-aab-build-manifest.json
          if-no-files-found: error
          retention-days: 30
