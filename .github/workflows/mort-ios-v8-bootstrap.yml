name: MORT iOS V8 Bootstrap

on:
  push:
    branches:
      - codex/ios-v8-integration
    paths:
      - 'ios/**'
      - 'MORT_IOS_V8_repo_patch.zip'
      - '.gitignore'
      - '.github/workflows/mort-ios-v8-bootstrap.yml'
      - 'MORT_IOS_V8_BUILD_STATUS.md'
      - 'docs/superpowers/specs/2026-09-17-mort-ios-v8-native-build-design.md'
      - 'docs/superpowers/plans/2026-09-17-mort-ios-v8-native-build-test.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mort-ios-v8-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap-build-test:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: codex/ios-v8-integration
          fetch-depth: 0

      - name: Verify patch archive
        run: |
          set -euo pipefail
          test -f MORT_IOS_V8_repo_patch.zip
          unzip -t MORT_IOS_V8_repo_patch.zip >/dev/null

      - name: Bootstrap native iOS V8 source when absent
        run: |
          set -euo pipefail
          if [[ -d ios/MORTIOSV8 && -f ios/project.yml ]]; then
            echo "Using committed native iOS source."
            exit 0
          fi
          PATCH_DIR="$RUNNER_TEMP/mort-ios-v8-patch"
          rm -rf "$PATCH_DIR"
          mkdir -p "$PATCH_DIR"
          unzip -q MORT_IOS_V8_repo_patch.zip -d "$PATCH_DIR"
          test -d "$PATCH_DIR/MORT_IOS_V8_repo_patch/ios/MORTIOSV8"
          rsync -a \
            --exclude '.github/workflows/mort-ios-v8-native.yml' \
            "$PATCH_DIR/MORT_IOS_V8_repo_patch/" ./

      - name: Verify native product contract
        run: |
          set -euo pipefail
          grep -F 'PRODUCT_NAME: MORTIOSV8' ios/project.yml
          grep -F 'INFOPLIST_KEY_CFBundleDisplayName: MORT' ios/project.yml

      - name: Verify native source is trackable
        run: |
          set -euo pipefail
          for path in ios/project.yml ios/MORTIOSV8/App/MORTIOSV8App.swift ios/MORTIOSV8Tests/MORTIOSV8Tests.swift; do
            test -f "$path"
            if git check-ignore -q "$path"; then
              echo "Native source is still ignored: $path" >&2
              git check-ignore -v "$path" || true
              exit 1
            fi
          done
          if ! git check-ignore -q ios/MORTIOSV8.xcodeproj/project.pbxproj 2>/dev/null; then
            echo 'Generated Xcode project must remain ignored.' >&2
            exit 1
          fi

      - name: Inspect toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          xcodegen generate --spec ios/project.yml
          test -d ios/MORTIOSV8.xcodeproj
          xcodebuild -project ios/MORTIOSV8.xcodeproj -scheme MORTIOSV8 -list

      - name: Select iPhone simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; ids=[x["udid"] for runtime in d.values() for x in runtime if x.get("isAvailable") and x.get("name", "").startswith("iPhone")]; print(ids[0] if ids else "")')"
          if [[ -z "$DEVICE_ID" ]]; then
            echo "No available iPhone simulator found" >&2
            exit 1
          fi
          echo "id=$DEVICE_ID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE_ID" -b

      - name: Build native app
        run: |
          set -euo pipefail
          xcodebuild build \
            -project ios/MORTIOSV8.xcodeproj \
            -scheme MORTIOSV8 \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
            -derivedDataPath "$RUNNER_TEMP/mort-ios-v8-derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Unit tests
        run: |
          set -euo pipefail
          xcodebuild test \
            -project ios/MORTIOSV8.xcodeproj \
            -scheme MORTIOSV8 \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
            -derivedDataPath "$RUNNER_TEMP/mort-ios-v8-derived" \
            -resultBundlePath "$RUNNER_TEMP/MORTIOSV8-UnitTests.xcresult" \
            -only-testing:MORTIOSV8Tests \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: UI launch smoke
        run: |
          set -euo pipefail
          xcodebuild test \
            -project ios/MORTIOSV8.xcodeproj \
            -scheme MORTIOSV8 \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
            -derivedDataPath "$RUNNER_TEMP/mort-ios-v8-derived" \
            -resultBundlePath "$RUNNER_TEMP/MORTIOSV8-UISmoke.xcresult" \
            -only-testing:MORTIOSV8UITests/MORTIOSV8UITests/testExample \
            -only-testing:MORTIOSV8UITests/MORTIOSV8UITestsLaunchTests/testLaunch \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Upload XCTest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mort-ios-v8-bootstrap-xcresults
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/MORTIOSV8-UnitTests.xcresult
            ${{ runner.temp }}/MORTIOSV8-UISmoke.xcresult

